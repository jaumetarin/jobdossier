services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobdossier_app
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jobdossier
      ANALYTICS_SERVICE_URL: http://analytics:8080
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - analytics
    command: npm run start:dev

  analytics:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: jobdossier_analytics
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      ANALYTICS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobdossier
      ANALYTICS_DATASOURCE_USERNAME: postgres
      ANALYTICS_DATASOURCE_PASSWORD: postgres
    volumes:
      - ./analytics-service:/app
      - /app/.mvn
    depends_on:
      - postgres
    command: ./mvnw spring-boot:run

  postgres:
    image: postgres:16-alpine
    container_name: jobdossier_postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobdossier
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
